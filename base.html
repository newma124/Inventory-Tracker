<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Inventory{% endblock %}</title>
    <style>
      :root { --bg:#ffffff; --card:#f4f4f4; --ink:#111111; --muted:#666666; --accent:#333333; }
      *{ box-sizing:border-box; }
      body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg); color:var(--ink); }
      header{ padding:16px 20px; border-bottom:1px solid #d9d9d9; }
      main{ max-width:1100px; margin:0 auto; padding:24px 20px; }
      a{ color: var(--accent); text-decoration:none; }
      .card{ background:var(--card); border:1px solid #d9d9d9; border-radius:14px; padding:18px; }
      .grid{ display:grid; gap:14px; }
      .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
      .btn{ display:inline-block; padding:8px 12px; border-radius:10px; border:1px solid #bbbbbb; background:#e6e6e6; color:#111111; }
      .btn.danger{ background:#f2d6d6; border-color:#cc9999; color:#661111; }
      .btn.secondary{ background:#dddddd; border-color:#bbbbbb; color:#111111; }
      input, select, textarea{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid #bbbbbb; background:#ffffff; color:#111111; }
      label{ font-size:0.9rem; color:var(--muted); }
      .flash{ padding:10px 12px; border-radius:10px; border:1px solid #bbbbbb; background:#efefef; }
      .muted{ color:var(--muted); font-size:0.9rem; }
      table{ width:100%; border-collapse:collapse; }
      th, td{ padding:10px 8px; border-bottom:1px solid #d9d9d9; }
      th{ text-align:left; color:#333333; font-weight:600; }
      .right{ text-align:right; }
      .stats{ display:flex; gap:12px; flex-wrap:wrap; }
      .chip{ padding:6px 10px; border-radius:999px; background:#e6e6e6; border:1px solid #bbbbbb; color:#111111; }
      .inline-help{ font-size:0.8rem; color:#666666; margin-top:4px; }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <a class="btn secondary" href="{{ url_for('list_items') }}">Home</a>
        <a class="btn" href="{{ url_for('new_item') }}">+ New Item</a>
        <a class="btn secondary" href="{{ url_for('report') }}">Report</a>
        <div style="flex:1"></div>
      </div>
    </header>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="grid" style="margin-bottom:14px">
            {% for category, message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
